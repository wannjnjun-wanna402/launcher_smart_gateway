#user  nobody;
worker_processes  1;

error_log  H:/nginx-1.30.2/logs/error.log;

pid        H:/nginx-1.30.2/logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    map_hash_bucket_size 128;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  H:/nginx-1.30.2/logs/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    client_body_temp_path H:/nginx-1.30.2/temp/client_body_temp;
    proxy_temp_path       H:/nginx-1.30.2/temp/proxy_temp;
    fastcgi_temp_path     H:/nginx-1.30.2/temp/fastcgi_temp;
    uwsgi_temp_path       H:/nginx-1.30.2/temp/uwsgi_temp;
    scgi_temp_path        H:/nginx-1.30.2/temp/scgi_temp;

    # API Key 认证
    map $http_authorization $auth_bearer_token {
        default                     "";
        "~*^Bearer\s+(.+)$"         $1;
    }

    map "$http_x_api_key:$auth_bearer_token" $api_key_combined {
        default     "";
        "~^([^:]+):"  $1;
        "~^:(.+)$"    $1;
    }

    map $api_key_combined $api_key_valid {
        default                         0;
        "ollamalaonanrenxianliaoqun"    1;
        "ollamalaopengyouxianliaoqun"   1;
    }

    server {
        listen       50080;
        server_name  _;

        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        proxy_connect_timeout   60s;
        client_max_body_size    100m;

        proxy_buffering         off;
        proxy_request_buffering off;

        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-KEY" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # ─── Ollama 后端 ───
        location /ollama/ {
            if ($api_key_valid = 0) {
                return 401 '{"error":"Unauthorized: Invalid or missing API KEY."}';
            }

            rewrite ^/ollama/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:11434;
            proxy_set_header Host 127.0.0.1:11434;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "";
        }

        # ─── llama.cpp 后端 ───
        location /llama/ {
            if ($api_key_valid = 0) {
                return 401 '{"error":"Unauthorized: Invalid or missing API KEY."}';
            }

            rewrite ^/llama/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host 127.0.0.1:8081;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "";
        }
    }
}
