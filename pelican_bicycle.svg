<!-- ============================================================
  鹈鹕骑自行车 · 动态 SVG（单文件，自带动画脚本）
  - 双踏板曲柄：脚踏始终水平、绕中轴旋转
  - 双腿逐帧逆运动学(IK)驱动：脚严格踩在踏板上同步运转
    (髻-膝-踝 两连杆解算，膝盖恒朝前上方)
  - 翅膀(手臂+羽翼)固定在左右两个车把握把点上并带爪尖
  - 轮子按行驶速度滚动、地面虚线流动、脖颈正弦摆动、身体微浮沉
  用法：浏览器直接打开本文件（或嵌入 HTML）。注意若用 <img> 引用，脚本不运行。
============================================================ -->
