allow = ["Bash(powershell -NoProfile -Command \"Get-Process | Sort-Object CPU -Descending | Select-Object -First 20 Name, Id, @{N='CPU_s';E={[math]::Round($_.CPU,1)}}, @{N='WS_MB';E={[math]::Round($_.WorkingSet64/1MB,1)}} | Format-Table -AutoSize\")", "Bash(nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader 2>&1)", "Bash(nvidia-smi 2>&1)", "Bash(netstat -ano | findstr \"8081 8083 51108\" 2>&1)", "Edit", "Bash(powershell -NoProfile:*)", "Bash(Select-String cache_prompt:*)", "Bash(python3 -c:*)", "explore", "Bash(python3 << 'PYEOF'\nimport re\n\npath = 'E:/llama-win-cuda-12.4-x64/launcher_main.ps1'\nwith open(path, 'r', encoding='utf-8') as f:\n    content = f.read()\n    original = content\n\nfixes = []\n\n# ===== BUG #1: 日志系统作用域错误 =====\n# Fix 1a: 行1288 - $g_DailyLogFile 缺少 $script: 前缀\nold1a = '        $g_DailyLogFile = $script:g_LogMain'\nnew1a = '        $script:g_DailyLogFile = $script:g_LogMain'\nif old1a in content:\n    content = content.replace(old1a, new1a)\n    fixes.append('1a: 日志系统 $g_DailyLogFile 添加 $script: 前缀')\nelse:\n    fixes.append('1a: NOT FOUND')\n\n# Fix 1b: 行1298 - 读取日志文件路径时也用 $script: 前缀\nold1b = '    Write-DailyLog \"LOG: 当前日志文件 = ${g_DailyLogFile}\"'\nnew1b = '    Write-DailyLog \"LOG: 当前日志文件 = ${script:g_DailyLogFile}\"'\nif old1b in content:\n    content = content.replace(old1b, new1b)\n    fixes.append('1b: 日志文件路径引用添加 $script: 前缀')\nelse:\n    # Try alternate\n    if '当前日志文件' in content:\n        fixes.append('1b: 找到但格式不同，手动处理')\n        for line in content.split('\\n'):\n            if '当前日志文件' in line:\n                fixes.append(f'  行内容: {line.strip()}')\n\n# ===== BUG #2: 27B switch case 缺少 break =====\nold2 = \"\"\"                $useCustom = $true\n            }\n            default          {\"\"\"\nnew2 = \"\"\"                $useCustom = $true\n                break\n            }\n            default          {\"\"\"\nif old2 in content:\n    content = content.replace(old2, new2)\n    fixes.append('2: qwen3.6-27b 添加 break')\nelse:\n    # Try matching with different whitespace\n    # Find the pattern more flexibly\n    idx = content.find('\"qwen3\\\\.6-27b\"')\n    if idx >= 0:\n        # Find the `$useCustom = $true` after it\n        after = content[idx:]\n        # Find `$useCustom = $true` then `default`\n        match = re.search(r'(\\$useCustom\\s*=\\s*\\$true)\\s*\\n\\s*\\}\\s*\\n\\s*(default\\s*\\{)', after)\n        if match:\n            full_old = match.group(0)\n            full_new = match.group(1) + '\\n                break\\n            }\\n            ' + match.group(2)\n            content = content[:idx] + content[idx:].replace(full_old, full_new, 1)\n            fixes.append(f'2: qwen3.6-27b 添加 break (regex匹配)')\n        else:\n            fixes.append('2: 无法匹配到精确位置')\n\n# ===== BUG #3: $prevNDec 未初始化 =====\n# 在循环开始前添加初始化\nold3 = '            $prevNDec = 0'\nnew3 = '            $prevNDec = 0'\nif old3 in content:\n    fixes.append('3: $prevNDec 已初始化')\nelse:\n    # Find where $prevNDec is first used\n    if '$prevNDec' in content:\n        # Add initialization before the while loop where it's used\n        # Find the line before the while loop\n        idx = content.find('$prevNDec = $currentNDec')\n        if idx >= 0:\n            # Find the start of the relevant block - look backwards for `$prevTg = 0`\n            prev_tg_idx = content.rfind('$prevTg = 0', 0, idx)\n            if prev_tg_idx >= 0:\n                line_start = content.rfind('\\n', 0, prev_tg_idx) + 1\n                before_init = content[line_start:prev_tg_idx]\n                if '$prevTg' in before_init:\n                    # Already has prevTg initialization, add prevNDec after it\n                    init_line_end = content.find('\\n', prev_tg_idx)\n                    insert_point = init_line_end\n                    # Check if $prevNDec = 0 already exists\n                    if '$prevNDec = 0' not in content[line_start:idx]:\n                        content = content[:insert_point] + '\\n            $prevNDec = 0' + content[insert_point:]\n                        fixes.append('3: 添加 $prevNDec = 0 初始化')\n                    else:\n                        fixes.append('3: $prevNDec = 0 已存在')\n                else:\n                    fixes.append('3: 找不到 prevTg 初始化位置')\n            else:\n                fixes.append('3: 找不到 prevTg 初始化位置')\n        else:\n            fixes.append('3: 找不到 prevNDec 引用位置')\n    else:\n        fixes.append('3: 文件中无 $prevNDec')\n\n# ===== BUG #5: Reasoning 不一致 =====\n# Fixed separately in miracle_api.py\n\n# ===== BUG #4: 死代码 $lastTgLogTime =====\nold4 = '            $lastTgLogTime = [DateTime]::MinValue'\nnew4 = '            # $lastTgLogTime = [DateTime]::MinValue  # 死代码，保留注释'\nif old4 in content:\n    content = content.replace(old4, new4)\n    fixes.append('4: 死代码 $lastTgLogTime 注释化')\nelse:\n    fixes.append('4: 未找到')\n\n# ===== BUG #7: Accuracy=0 显示为 \"-\" =====\nold7 = '            $acc = if ($b.Accuracy) {'\nnew7 = '            $acc = if ($b.Accuracy -or $b.Accuracy -eq 0) {'\nif old7 in content:\n    content = content.replace(old7, new7)\n    fixes.append('7: Accuracy=0 修复')\nelse:\n    # Try alternate format\n    idx = content.find('if ($b.Accuracy)')\n    if idx >= 0:\n        line = content[idx:content.find('\\n', idx)]\n        if '$acc' in line:\n            fixes.append(f'7: 找到但格式不同: {line.strip()}')\n        else:\n            fixes.append('7: 未找到匹配')\n    else:\n        fixes.append('7: 未找到')\n\n# ===== BUG #8: 注释层级错乱 =====\nold8 = '# #  启动服务'\nnew8 = '#  启动服务'\nif old8 in content:\n    content = content.replace(old8, new8)\n    fixes.append('8: 注释层级错乱修复')\nelse:\n    fixes.append('8: 未找到')\n\n# ===== BUG #9: $line 隐式输出 =====\n# Find the implicit $line in ForEach-Object\n# Line 1353 area: just `$line` on its own\n# We need to find the right context\nidx = content.find('$line  # 控制台输出')\nif idx >= 0:\n    # Check if the line before it has `$line` on its own\n    line_start = content.rfind('\\n', 0, idx) + 1\n    line_content = content[line_start:content.find('\\n', idx)]\n    if line_content.strip() == '$line':\n        # Replace it\n        old9 = line_content.strip()\n        new9 = 'Write-Host $line'\n        content = content[:line_start] + content[line_start:].replace(old9, new9, 1)\n        fixes.append('9: $line 隐式输出改为 Write-Host')\n    else:\n        fixes.append(f'9: 行内容不是单独的 $line: {line_content.strip()}')\nelse:\n    fixes.append('9: 未找到')\n\nif content != original:\n    with open(path, 'w', encoding='utf-8') as f:\n        f.write(content)\n    print('=== 修复完成 ===')\nelse:\n    print('=== 无变化 ===')\n\nfor f in fixes:\n    print(f'  {f}')\nPYEOF)", "Bash(python3 << 'PYEOF'\npath = 'E:/llama-win-cuda-12.4-x64/launcher_main.ps1'\nwith open(path, 'r', encoding='utf-8') as f:\n    content = f.read()\n\n# Check what we have\nchecks = {\n    '1a: $script:g_DailyLogFile': '$script:g_DailyLogFile = $script:g_LogMain' in content,\n    '1b: 日志文件路径引用': '${script:g_DailyLogFile}' in content,\n    '2: 27B break': 'qwen3\\\\.6-27b' in content and 'break' in content[content.find('\"qwen3\\\\'):content.find('\"qwen3\\\\')+500],\n    '3: $prevNDec初始化': '$prevNDec = 0' in content,\n    '4: 死代码': '# $lastTgLogTime' in content,\n    '7: Accuracy=0': 'if ($b.Accuracy -or $b.Accuracy -eq 0)' in content,\n    '8: 注释': '#  启动服务' in content and '# #  启动服务' not in content,\n    '9: Write-Host': 'Write-Host $line' in content,\n}\n\nfor k, v in checks.items():\n    print(f'  {\"✅\" if v else \"❌\"} {k}')\n\n# Show remaining issues\nprint('\\n--- 未修复项目 ---')\n# Find $prevNDec initialization\nidx = content.find('$prevNDec')\nif idx >= 0:\n    ctx = content[max(0,idx-200):idx+200]\n    print(f'\\n$prevNDec context:')\n    for line in ctx.split('\\n'):\n        if 'prev' in line.lower() or 'NDec' in line:\n            print(f'  {line.strip()}')\n\n# Find Accuracy\nidx = content.find('$b.Accuracy')\nif idx >= 0:\n    ctx = content[max(0,idx-100):idx+200]\n    print(f'\\nAccuracy context:')\n    for line in ctx.split('\\n'):\n        if 'ccuracy' in line or 'acc' in line.lower():\n            print(f'  {line.strip()}')\n\n# Find $line line\nidx = content.find('控制台输出')\nif idx >= 0:\n    line_start = content.rfind('\\n', 0, idx) + 1\n    line_end = content.find('\\n', idx)\n    print(f'\\n$line context:')\n    print(f'  {content[line_start:line_end]}')\nPYEOF)", "Bash(python3 << 'PYEOF'\npath = 'E:/llama-win-cuda-12.4-x64/launcher_main.ps1'\nwith open(path, 'r', encoding='utf-8') as f:\n    content = f.read()\n\noriginal = content\n\n# Fix 3: Add $prevNDec = 0 after $prevTg = 0.0\nold3 = '    $prevTg = 0.0\\n    $tgCount = 0'\nnew3 = '    $prevTg = 0.0\\n    $prevNDec = 0\\n    $tgCount = 0'\ncontent = content.replace(old3, new3, 1)\n\n# Fix 4: Comment out dead code $lastTgLogTime\nold4 = '    $lastTgLogTime = [DateTime]::MinValue'\nnew4 = '    # $lastTgLogTime = [DateTime]::MinValue  # 死代码，保留兼容'\ncontent = content.replace(old4, new4, 1)\n\n# Fix 7: Accuracy=0 should show as \"0\" not \"-\"\nold7 = '$acc = if ($b.Accuracy) { [math]::Round($b.Accuracy, 1) } else { \"-\" }'\nnew7 = '$acc = if ($null -ne $b.Accuracy) { [math]::Round($b.Accuracy, 1) } else { \"-\" }'\ncontent = content.replace(old7, new7, 1)\n\nif content != original:\n    with open(path, 'w', encoding='utf-8') as f:\n        f.write(content)\n    print('OK: All fixes applied')\nelse:\n    print('FAIL: No changes')\nPYEOF)", "Bash(which python 2>/dev/null || which python3 2>/dev/null || where python 2>/dev/null || echo \"not found\")"]
