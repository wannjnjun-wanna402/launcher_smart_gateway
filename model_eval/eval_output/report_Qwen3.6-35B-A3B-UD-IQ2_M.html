. **环境保留**：被引用的外部变量不会被垃圾回收器释放，而是随闭包一起驻留内存\n\n---\n### 📖 经典示例（JavaScript）\n```javascript\nfunction createCounter() {\n  let count = 0; // 外层局部变量\n  return function increment() {\n    count++;     // 引用并修改外部变量\n    console.log(count);\n  };\n}\n\nconst counter = createCounter(); // createCounter 已执行完毕，但闭包形成\ncounter(); // → 1\ncounter(); // → 2\n```\n💡 **为什么能成功？**  \n`increment` 函数被返回后调用时，JS 引擎会保留 `count` 的内存地址。闭包本质上是**函数代码 + 引用环境的指针**的组合体。\n\n---\n### 🛠️ 常见用途\n| 场景 | 说明 |\n|------|------|\n| **数据封装/私有状态** | 模拟面向对象中的“私有变量”，避免全局污染 |\n| **回调与事件处理** | 保持多次调用间的上下文（如定时器、防抖节流） |\n| **高阶函数编程** | `curry`、`memoization`、配置化工厂函数的核心机制 |\n| **现代框架底层** | React Hooks (`useState`)、Vue 响应式、Redux store 均依赖闭包管理状态 |\n\n---\n### ⚠️ 注意事项与常见误区\n1. **不是语法糖，而是语言设计特性**：源于词法作用域（Lexical Scoping）机制，Lisp 最早提出，JS/Python/Swift/Rust 等均有实现。\n2. **内存占用**：闭包持有的变量会长期驻留堆内存。滥用或未及时释放可能导致性能问题。\n3. **“捕获的是引用而非快照”**（部分语言如 JS、Python）：修改外部可变对象会影响所有共享该引用的闭包；若需隔离，应显式拷贝值。\n4. **不同语言的差异**：\n   - Python 使用 `nonlocal`/`global` 显式声明可写权限\n   - Java/C# 要求内部类引用的变量必须是 `final`（JDK9+ 改为 effectively final）\n\n---\n### 💡 一句话总结\n> 闭包 = **函数 + 它定义时所在的作用域环境**。它让数据与行为绑定，实现状态持久化与信息隐藏，是现代编程中“高阶抽象”的基石之一。\n\n如需针对某门语言（如 Python、Swift、Rust）或具体场景深入讲解，可告知你的使用栈，我会提供对应示例与原理解析。", "ttft": 1.134, "total_time": 141.864, "error": null, "tok_s": 12.24, "completion_tokens": 1722, "gen_time": 140.73, "score": {"correctness": null, "qscore": null, "note": "计入全局TTFT", "auto": true}}, {"id": "S04", "dim": "响应速度", "prompt": "解释 HTTP 与 HTTPS 的区别。", "output": "HTTP（HyperText Transfer Protocol）和 HTTPS（Hypertext Transfer Protocol Secure）都是用于在客户端（如浏览器）与服务器之间传输数据的应用层协议，但它们在**安全性、工作原理和使用场景**上有本质区别。以下是详细对比：\n\n### 🔑 核心区别一览\n| 对比项 | HTTP | HTTPS |\n|--------|------|-------|\n| **全称/定义** | 超文本传输协议（明文） | HTTP + SSL/TLS 加密层 |\n| **默认端口** | `80` | `443` |\n| **数据传输方式** | 明文发送，易被窃听或篡改 | 使用 TLS/SSL 进行端到端加密 |\n| **是否需要证书** | ❌ 不需要 | ✅ 需要由受信任的 CA（证书颁发机构）签发的数字证书 |\n| **身份验证** | 无服务器身份校验机制 | 通过证书验证服务器真实性，防中间人攻击 |\n| **浏览器标识** | Chrome/Firefox 等标记为 `“不安全”` 🔓 | 显示🔒锁形图标 + “安全”提示（部分 OV/EV 证书显示企业名称） |\n| **性能开销** | 无加密延迟，连接最快 | TLS握手会增加首次连接耗时，但现代优化（TLS 1.3、0-RTT、HTTP/2+HTTPS 组合压缩）已使体验接近明文 |\n\n---\n\n### 🛡️ 技术原理简述\n- **HTTP**：数据以原始文本或二进制流直接发送。攻击者可通过网络嗅探获取账号密码、Cookie，或通过中间人（MITM）篡改响应内容。\n- **HTTPS**：在 HTTP 之上增加了一层 **TLS（Transport Layer Security）** 协议（早期称 SSL）。其核心作用包括：\n  1. **加密通信**：使用非对称加密协商密钥，再用对称加密传输数据。\n  2. **完整性校验**：通过 MAC/HMAC 防止数据被篡改。\n  3. **身份认证**：服务器出示由可信 CA 签发的证书，客户端验证其有效性（含域名匹配、有效期、吊销状态等）。\n\n---\n\n### 🌐 实际影响与现代标准\n- ✅ **安全强制化**：Chrome 56+ 已将所有 HTTP 页面标记为“不安全”；现代 Web API（如地理位置、WebRTC、支付接口）已要求必须运行在 HTTPS/Secure Context 下。\n- 🔍 **SEO 排名因素**：Google 明确将 HTTPS 作为网页搜索排名的正向信号。\n- 📱 **用户体验与合规**：金融、电商、登录页等涉及敏感数据的场景，HTTPS 已是行业底线；GDPR、等保2.0 等法规也强烈推荐或强制要求加密传输。\n\n---\n\n### 💡 总结\n> **HTTP 是“裸奔”的通信协议，HTTPS 是穿上防弹衣+身份证件的安全版本。**  \n在现代互联网中，HTTP 仅适用于完全公开且无敏感数据的静态资源（如部分 CDN 图片），而 **HTTPS 已是所有 Web 应用的默认标准**。迁移到 HTTPS 不仅是安全要求，更是性能优化（配合 HTTP/2、QUIC）和生态兼容的必要前提。\n\n如需了解如何申请免费证书、配置服务器或排查 HTTPS 报错，可进一步说明具体场景。", "ttft": 0.828, "total_time": 139.367, "error": null, "tok_s": 12.5, "completion_tokens": 1732, "gen_time": 138.539, "score": {"correctness": null, "qscore": null, "note": "计入全局TTFT", "auto": true}}, {"id": "M01", "dim": "数学能力", "prompt": "计算：91 + 24 = ?", "output": "115", "ttft": 1.012, "total_time": 30.441, "error": null, "tok_s": 0.07, "completion_tokens": 363, "gen_time": 29.429, "score": {"correctness": true, "qscore": 100.0, "note": "期望≈115.0", "auto": true}}, {"id": "M02", "dim": "数学能力", "prompt": "计算：45 + 41 = ?", "output": "$45 + 41 = \\mathbf{86}$", "ttft": 41.571, "total_time": 42.745, "error": null, "tok_s": 13.63, "completion_tokens": 506, "gen_time": 1.174, "score": {"correctness": true, "qscore": 100.0, "note": "期望≈86.0", "auto": true}}, {"id": "M03", "dim": "数学能力", "prompt": "计算：27 × 23 = ?", "output": "**答案：** 27 × 23 = **621**\n\n💡 **简便算法提示（平方差公式）：**  \n观察 27 和 23 关于 25 对称，可变形为：  \n(25 + 2) × (25 − 2) = 25² − 2² = 625 − 4 = **621**", "ttft": 40.742, "total_time": 49.312, "error": null, "tok_s": 10.62, "completion_tokens": 537 (function(){
  const M = RESULTS.meta;
  document.getElementById('meta').textContent =
    `模型：${M.model} ｜ 接口：${M.api_base} ｜ 生成时间：${M.timestamp} ｜ 总题数：${M.total_questions}`;
  // 概览卡片
  const cards = [
    ['综合得分', RESULTS.overall.toFixed(1)],
    ['总题数', M.total_questions],
    ['平均生成速度', RESULTS.speed.avg_tok_s + ' tok/s'],
    ['最快/最慢单题', RESULTS.speed.max_tok_s + ' / ' + RESULTS.speed.min_tok_s + ' tok/s'],
    ['平均首字延迟', RESULTS.speed.avg_ttft + 's'],
    ['P50/P95延迟', RESULTS.speed.p50_ttft + '/' + RESULTS.speed.p95_ttft + 's'],
    ['自动判分正确率', RESULTS.auto_rate != null ? RESULTS.auto_rate + '%' : '—'],
  ];
  document.getElementById('cards').innerHTML = cards.map(c=>
    `<div class="card"><div class="v">${c[1]}</div><div class="l">${c[0]}</div></div>`).join('');
  // 雷达 + 柱状
  const dims = RESULTS.dim_order;
  const scores = dims.map(d => RESULTS.dims[d].avg_score == null ? 0 : RESULTS.dims[d].avg_score);
  new Chart(document.getElementById('radar'), {
    type:'radar',
    data:{ labels:dims, datasets:[{ label:'得分', data:scores,
      backgroundColor:'rgba(42,98,175,.25)', borderColor:'#2b5d9e', borderWidth:2,
      pointBackgroundColor:'#1c4979' }]},
    options:{ responsive:true, scales:{ r:{ min:0, max:100, ticks:{stepSize:20} } }, plugins:{legend:{display:false}} }
  });
  new Chart(document.getElementById('bar'), {
    type:'bar',
    data:{ labels:dims, datasets:[{ label:'得分', data:scores,
      backgroundColor:'#3d7eb3', borderRadius:6 }]},
    options:{ responsive:true, scales:{ y:{ min:0, max:100 } }, plugins:{legend:{display:false}} }
  });
  // 维度表
  const tb = document.querySelector('#dimtbl tbody');
  tb.innerHTML = dims.map(d=>{
    const x = RESULTS.dims[d];
    const rate = x.auto_rate != null ? x.auto_rate + '%' : '—';
    const sc = x.avg_score != null ? x.avg_score : '—';
    return `<tr><td>${d}</td><td>${x.n}</td><td>${rate}</td><td>${sc}</td><td>${x.note||''}</td></tr>`;
  }).join('');
  // 逐题
  const ql = document.getElementById('qlist');
  ql.innerHTML = RESULTS.results.map(r=>{
    const s = r.score || {};
    let tag = '<span class="tag na">—</span>';
    if (s.correctness === true) tag = '<span class="tag ok">正确</span>';
    else if (s.correctness === false) tag = '<span class="tag bad">错误</span>';
    else if (s.auto === false) tag = '<span class="tag auto">启发式</span>';
    const sc = s.qscore != null ? `｜得分 ${s.qscore}` : '';
    return `<details><summary>[${r.id}] ${r.dim} ${tag} ${sc} ｜ TTFT ${r.ttft}s ｜ 速度 ${r.tok_s} tok/s (${r.completion_tokens} tok / ${r.gen_time}s)</summary>
      <div class="q"><b>问：</b>${escapeHtml(r.prompt)}</div>
      <div class="a"><b>答：</b>${escapeHtml(r.output || '(无输出/错误: '+(r.error||'')+')')}</div>
      <div style="font-size:12px;color:#5c6f8c;margin-top:4px;">判分备注：${s.note||''}</div>
    </details>`;
  }).join('');

  ];

    `<tr><td>${r.id}</td><td>${r.dim}</td><td>${r.tok_s}</td><td>${r.completion_tokens ?? '—'}</td><td>${r.gen_time}</td></tr>`);

    options: { responsive: true,
      scales: { y: { beginAtZero: true, title: { display: true, text: 'tokens/s' } } },
      plugins: { legend: { display: false } } }
  });
  function escapeHtml(t){ return (t||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
})();
